# Local verification infrastructure (UNVERIFIED here: Docker daemon unavailable in the authoring sandbox).
#   docker compose -f docker-compose.sprint5.yml up -d postgres minio
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: notiv, POSTGRES_DB: notiv}
    ports: ["55432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
  minio:
    image: minio/minio
    command: server /data
    environment: {MINIO_ROOT_USER: notiv, MINIO_ROOT_PASSWORD: notivnotiv}
    ports: ["59000:9000"]
  minio-init:                       # creates the PRIVATE test bucket (no anonymous access policy is set)
    image: minio/mc
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "sleep 3; mc alias set l http://minio:9000 notiv notivnotiv && mc mb --ignore-existing l/notiv-test"]
