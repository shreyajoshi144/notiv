# Local PostgreSQL + private S3 for the integration tests (test-only credentials; never use them anywhere else).
#   docker compose -f docker-compose.sprint5.yml up -d
#   NOTIV_TEST_DATABASE_URL=postgresql://postgres:notiv@localhost:55432/notiv \
#   NOTIV_TEST_S3_ENDPOINT=http://localhost:59000 NOTIV_TEST_S3_BUCKET=notiv-test \
#   AWS_ACCESS_KEY_ID=notiv AWS_SECRET_ACCESS_KEY=notivnotiv AWS_DEFAULT_REGION=us-east-1 bash tools/verify_sprint5.sh
# S3 is SeaweedFS (MinIO no longer publishes public images); anonymous requests are denied.
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: notiv, POSTGRES_DB: notiv}
    ports: ["55432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    volumes: ["./tools/seaweedfs-s3.json:/etc/s3.json:ro"]
    ports: ["59000:8333"]
  s3-init:                          # creates the PRIVATE test bucket
    image: chrislusf/seaweedfs
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c", "sleep 10; echo 's3.bucket.create -name notiv-test' | weed shell -master=s3:9333"]
